name: TV Christian Daily MP4
on:
  workflow_dispatch:
    inputs:
      demo:
        description: "Make a 20-second test video only"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '0 20 * * *' # 05:00 Asia/Seoul (UTC+9)
permissions:
  contents: read
jobs:
  make-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg and Korean fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Render videos
        env:
          TZ: Asia/Seoul
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.demo }}" = "true" ]; then
            python make_video.py --demo
          else
            python make_video.py
          fi
      - name: Upload MP4 videos
        uses: actions/upload-artifact@v4
        with:
          name: tv-christian-mp4-${{ github.run_number }}
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 14
