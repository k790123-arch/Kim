name: TV Christian Daily MP4
on:
  workflow_dispatch:
    inputs:
      demo:
        description: "Generate 20-second test video instead of full videos"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "make_video.py"
      - "requirements.txt"
      - ".github/workflows/daily-video.yml"
  schedule:
    - cron: '0 22 * * *' # 07:00 Asia/Seoul (UTC+9)
permissions:
  contents: read
jobs:
  make-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install ffmpeg and Korean fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Render videos
        env:
          TZ: Asia/Seoul
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.demo }}" = "true" ]; then
            python make_video.py --demo
          else
            python make_video.py
          fi
      - name: Upload MP4 videos
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tv-christian-mp4-${{ github.run_number }}
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 14
