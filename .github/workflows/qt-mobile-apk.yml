name: QT mobile APK
on:
  push:
    branches: [qt-mobile-uploader]
    paths: ["qt-mobile/**", ".github/workflows/qt-mobile-apk.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: true
      - name: Build and test the Android uploader
        working-directory: qt-mobile
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK signature and record this build's public certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/qt-output"
          cp qt-mobile/app/build/outputs/apk/debug/app-debug.apk "${RUNNER_TEMP}/qt-output/TV-QT-Uploader.apk"
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$signer" verify --verbose --print-certs "${RUNNER_TEMP}/qt-output/TV-QT-Uploader.apk" > "${RUNNER_TEMP}/qt-output/certificate.txt"
          cat "${RUNNER_TEMP}/qt-output/certificate.txt"
          (cd "${RUNNER_TEMP}/qt-output" && sha256sum TV-QT-Uploader.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: tv-qt-android
          path: ${{ runner.temp }}/qt-output/
          if-no-files-found: error
          retention-days: 30
